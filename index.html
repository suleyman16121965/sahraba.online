<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAHRABA TRAVEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
  header { background:#0071c2; padding:20px; text-align:center; color:white; font-size:26px; }
  .container { width:90%; max-width:1200px; margin:auto; }

  /* Flight Search Box */
  .flight-box {
    background:white;
    padding:25px;
    margin-top:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
  }
  .flight-title {
    font-size:24px;
    margin-bottom:15px;
    text-align:center;
  }

  /* Hotel Section */
  .hotel-section {
    margin-top:50px;
    text-align:center;
  }
  .hotel-btn {
    padding:14px 30px;
    background:#0071c2;
    color:white;
    border-radius:8px;
    text-decoration:none;
    font-size:18px;
  }
</style>
</head>

<body>

<header>SAHRABA TRAVEL – Flight Search</header>

<div class="container">

  <!-- ⭐ FLIGHT SEARCH DIRECT ON HOMEPAGE ⭐ -->
  <div class="flight-box">
    <div class="flight-title">Search Flights</div>

    <!-- Travelpayouts Flight Widget -->
    <script async src="https://tp.media/content?currency=usd&trs=264258&shmarker=503475&searchUrl=www.aviasales.com%2Fsearch&locale=en&powered_by=true&promo_id=7879&campaign_id=100"></script>
  </div>

  <!-- ⭐ Hotels Button (Separate Page) ⭐ -->
  <div class="hotel-section">
    <h2>Hotel Bookings</h2>
    <a href="hotels.html" class="hotel-btn">View Hotels</a>
  </div>

</div>

</body>
</html>
